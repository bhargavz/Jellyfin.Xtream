name: "🔬 Run CodeQL"

on:
  push:
  pull_request:
  workflow_dispatch:

# The reusable workflow uploads results to code scanning, which needs security-events: write.
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  call:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/scan-codeql.yaml@master
    with:
      dotnet-version: "10.0.*"
      repository-name: bhargavz/Jellyfin.Xtream
