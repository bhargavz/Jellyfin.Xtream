version: "0.11.0.0"
targetAbi: "12.0.0.0"
framework: "net10.0"
overview: "Stream content from an Xtream-compatible server."
description: >
  Stream Live IPTV, Video On-Demand, and Series from an Xtream-compatible server using this plugin.
category: "LiveTV"
owner: "bhargavz"
artifacts:
  - "Jellyfin.Xtream.dll"
changelog: >
  bhargavz fork for Jellyfin 12: XMLTV guide from a URL (cached, gzip) with automatic
  channel matching by EPG id and name, only matched programmes kept in memory, XMLTV-covered
  channels skip per-channel Xtream EPG calls, duplicate streams across categories removed,
  configurable API timeout (default 300 s), EPG "start" text no longer breaks parsing,
  hex Xtream EPG ids no longer collapse a channel's programmes into one GUID (0.10.1).
  0.11: max-concurrent-streams limit with a clean "limit reached" error (same-channel viewers share one
  connection); fallback XMLTV URLs (e.g. epgshare01) that fill only channels the provider guide misses;
  stricter channel matching (feed tags, country hints, call signs); per-channel EPG time shift (#217);
  duplicate guide ids guarded and logged (#242); settings render once (#256) with UI fields for API
  timeout, max streams and guide refresh; option to hide stale event channels; option to build stream
  URLs from the provider's server_info.
